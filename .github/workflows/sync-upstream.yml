name: Sync RawTherapee upstream and build releases

on:
  push:
    branches:
      - autoenable
    paths:
      - .github/workflows/sync-upstream.yml
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: rawtherapee-upstream-sync
  cancel-in-progress: false

jobs:
  sync-and-dispatch:
    name: Fast-forward upstream dev and start official builds
    if: github.repository == '969981/RawTherapee'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream and fast-forward dev safely
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/RawTherapee/RawTherapee.git
          git fetch --no-tags upstream refs/heads/dev:refs/remotes/upstream/dev
          git fetch --no-tags origin refs/heads/dev:refs/remotes/origin/dev

          latest="$(git rev-parse refs/remotes/upstream/dev)"
          current="$(git rev-parse refs/remotes/origin/dev)"
          echo "Upstream dev: $latest"
          echo "Fork dev:     $current"
          echo "source_sha=$latest" >> "$GITHUB_OUTPUT"

          # Import source changes with upstream as a merge parent, but do not
          # import upstream Actions files: GITHUB_TOKEN lacks workflows scope.
          # Never rewrite a divergent dev branch or force-push.
          if git merge-base --is-ancestor "$latest" "$current"; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "Upstream $latest is already contained in fork dev."
          else
            if ! git merge-base --is-ancestor "$current" "$latest"; then
              echo "::error::Fork dev has diverged from upstream dev. Manual review required."
              exit 1
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git switch -C dev "refs/remotes/origin/dev"
            git merge --no-ff --no-commit "$latest"
            # Retain the complete existing workflow tree, including deletions
            # of any new upstream-only workflows in the merge index.
            git restore --source="$current" --staged --worktree -- .github/workflows
            if ! git diff --cached --quiet "$current" -- .github/workflows; then
              echo "::error::Workflow files changed after restore; refusing to push."
              exit 1
            fi
            git commit -m "chore(sync): import upstream dev $latest without upstream workflows"
            git push origin HEAD:refs/heads/dev
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "Imported upstream source $latest, preserving fork workflows."
          fi

      - name: Dispatch Linux, Windows and macOS official release workflows
        if: steps.upstream.outputs.needs_build == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.upstream.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in appimage.yml windows.yml macos.yml; do
            echo "Dispatching $workflow for dev ($SOURCE_SHA)"
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref dev
          done

      - name: Report no changes
        if: steps.upstream.outputs.needs_build != 'true'
        run: echo "No new upstream commits to build." >> "$GITHUB_STEP_SUMMARY"
